<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kakei — money tracker">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F3B8F"/>
      <stop offset="50%" stop-color="#5B6BD6"/>
      <stop offset="100%" stop-color="#2F3B8F"/>
    </linearGradient>

    <!-- The same 45 degree lattice as the app shell, at the app's own spacing:
         this image is a picture of the product, not a poster about it. -->
    <pattern id="lattice" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M-14 14 L14 -14 M0 56 L56 0 M42 70 L70 42"
            stroke="#2F3B8F" stroke-opacity="0.07" stroke-width="1.5" fill="none"/>
      <path d="M-14 42 L14 70 M0 0 L56 56 M42 -14 L70 14"
            stroke="#2F3B8F" stroke-opacity="0.07" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F7F5F0"/>
  <rect width="1200" height="630" fill="url(#lattice)"/>

  <!-- Mark, sized and cornered like the real app icon. -->
  <rect x="110" y="165" width="300" height="300" rx="66" fill="#FFFFFF"/>
  <rect x="110" y="165" width="300" height="300" rx="66" fill="none"
        stroke="#2F3B8F" stroke-opacity="0.12" stroke-width="2"/>
  <text x="260" y="315" fill="url(#ink)"
        font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif"
        font-size="112" font-weight="600" letter-spacing="-3"
        text-anchor="middle" dominant-baseline="central">家計</text>

  <text x="474" y="285" fill="url(#ink)"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="128" font-weight="700" letter-spacing="-4">Kakei</text>

  <text x="474" y="372" fill="#1B1D2B"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="500">What came in, what went out,</text>
  <text x="474" y="424" fill="#1B1D2B"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="500">and where it went.</text>

  <!-- A donut of a month's spending: the app's own visual signature, and it
       fills the bottom band without any words. -->
  <g fill="none" stroke-width="26">
    <circle cx="530" cy="520" r="42" stroke="#EBEAF6"/>
    <circle cx="530" cy="520" r="42" stroke="#B5654A"
            stroke-dasharray="92 172" stroke-dashoffset="0" transform="rotate(-90 530 520)"/>
    <circle cx="530" cy="520" r="42" stroke="#4F5BD5"
            stroke-dasharray="66 198" stroke-dashoffset="-92" transform="rotate(-90 530 520)"/>
    <circle cx="530" cy="520" r="42" stroke="#2B8A9E"
            stroke-dasharray="40 224" stroke-dashoffset="-158" transform="rotate(-90 530 520)"/>
    <circle cx="530" cy="520" r="42" stroke="#D4557A"
            stroke-dasharray="28 236" stroke-dashoffset="-198" transform="rotate(-90 530 520)"/>
  </g>

  <g fill="#2F8F63">
    <rect x="640" y="546" width="18" height="18" rx="4" fill-opacity="0.35"/>
    <rect x="668" y="530" width="18" height="34" rx="4" fill-opacity="0.55"/>
    <rect x="696" y="512" width="18" height="52" rx="4" fill-opacity="0.75"/>
    <rect x="724" y="490" width="18" height="74" rx="4" fill-opacity="1"/>
  </g>
</svg>
