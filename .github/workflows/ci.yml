name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted; there is no point paying for a
# result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Matches the engines range in package.json.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run as separate steps rather than one `pnpm check`: a red X lands on the
      # step that failed, so the reason is visible without opening the log.
      - name: Formatting
        run: pnpm check:format

      - name: Lint
        run: pnpm check:lint

      - name: Types
        run: pnpm type-check

      - name: Tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build-only
        env:
          # The client throws on missing config at runtime, not at build time,
          # so these only need to exist. Real values live in Vercel.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
